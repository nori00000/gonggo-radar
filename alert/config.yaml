app:
  name: "농업공고알림봇"
  version: "1.0.0"
  log_level: "INFO"
  data_dir: "data"

crawler:
  timeout: 30
  retry_count: 3
  retry_delay: 5
  user_agent: "AgriAlert/1.0"
  sources:
    bizinfo:
      enabled: true
      base_url: "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do"
    mafra:
      enabled: true
      base_url: "https://www.mafra.go.kr/bbs/home/791/rssList.do?row=50"
    smartfarm:
      enabled: true
      base_url: "https://www.smartfarmkorea.net"
    goyang:
      enabled: true
      base_url: "https://www.goyang.go.kr/agr"
    nongsaro:
      enabled: true
      base_url: "https://www.nongsaro.go.kr"
    g2b:
      enabled: true
      base_url: "http://apis.data.go.kr/1230000/BidPublicInfoService"
      filter_keywords:
        - "조경"
        - "녹화"
        - "정원"
        - "이끼"
        - "수목"
        - "식재"
        - "녹지"
        - "도시숲"
        - "학교숲"
        - "탄소숲"
        - "치유정원"
        - "스마트팜"
        - "시설원예"
        - "농업"
        - "산림"
        - "치유"
        - "사회적기업"
    kstartup:
      enabled: true
      base_url: "https://apis.data.go.kr/B552735/kisedKstartupService01"
    smes:
      enabled: true
      base_url: "https://www.smes.go.kr"
    subsidy24:
      enabled: true
      base_url: "https://apis.data.go.kr/B554287/SubsidyBusinessInfoService/getSubsidyBusinessInfo"
    forest_service:
      enabled: true
      base_url: "https://www.forest.go.kr"
    gyeonggi:
      enabled: true
      base_url: "https://www.gg.go.kr"
    gafi:
      enabled: true
      base_url: "https://www.gafi.or.kr"
    gbsa:
      enabled: true
      base_url: "https://www.gbsa.or.kr"
    socialenterprise:
      enabled: true
      base_url: "https://www.socialenterprise.or.kr"
    ekr:
      enabled: true
      base_url: "https://www.ekr.or.kr"
    epis:
      enabled: true
      base_url: "https://www.epis.or.kr"
    nongup_gg:
      enabled: true
      base_url: "https://nongup.gg.go.kr"
    rda:
      enabled: true
      base_url: "https://www.rda.go.kr"
    semas:
      enabled: true
      base_url: "https://www.semas.or.kr"
    kosmes:
      enabled: true
      base_url: "https://www.kosmes.or.kr"
    ipet:
      enabled: true
      base_url: "https://www.ipet.re.kr"
    apfs:
      enabled: true
      base_url: "https://www.apfs.kr"
    agrohealing:
      enabled: true
      base_url: "https://agrohealing.go.kr"
    fowi:
      enabled: true
      base_url: "https://fowi.or.kr"
    seis:
      enabled: true
      base_url: "https://www.seis.or.kr"
    ggeea:
      enabled: true
      base_url: "https://www.ggeea.or.kr"
    mois_sse:
      enabled: true
      base_url: "https://www.mois.go.kr"
    goyang_startup:
      enabled: true
      base_url: "https://www.goyangstartup.kr"
    kofpi:
      enabled: true
      base_url: "https://www.kofpi.or.kr"
      bypass_threshold: true
    forest_press:
      enabled: true
      base_url: "https://www.forest.go.kr"
      bypass_threshold: true
    lawmaking:
      enabled: true
      base_url: "https://opinion.lawmaking.go.kr"
      bypass_threshold: true
    coop:
      enabled: true
      base_url: "https://www.coop.go.kr"
      bypass_threshold: true

analyzer:
  keyword_threshold: 0.3
  claude_threshold: 0.3
  claude_model: "claude-sonnet-4-5-20250929"
  max_claude_calls_per_run: 50
  # LLM 백엔드 설정: "auto" | "claude" | "ollama" | "none"
  # auto: ANTHROPIC_API_KEY 있으면 claude, 없으면 ollama
  # none: LLM 2차 분석을 건너뛰고 키워드 점수만 사용 (analyzer.py의 backend 가드)
  #       m1-pro 운영 기준값: Anthropic API 사용 금지 + ollama 미설치
  llm_backend: "none"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:72b"

keywords:
  must_match:
    # 이끼 재배 / 스마트팜
    - "이끼"
    - "스마트팜"
    - "시설원예"
    - "시설농업"
    - "스마트농업"
    # 조경 / 정원
    - "조경"
    - "도시녹화"
    - "학교숲"
    - "탄소숲"
    # 치유산업
    - "치유농업"
    - "산림치유"
    # 사회적기업
    - "사회적기업"
    - "소셜벤처"
  boost:
    # 농업 일반
    - "농업"
    - "영농"
    - "귀농"
    - "청년농"
    - "신규농업인"
    - "농업기술"
    - "농업지원"
    - "보조금"
    - "지원사업"
    - "공모"
    # 지역
    - "경기도"
    - "고양시"
    # 농업 세부
    - "6차산업"
    - "농촌"
    - "ICT"
    - "스마트온실"
    - "환경제어"
    - "식물공장"
    - "특용작물"
    - "관상식물"
    # 조경 / 정원
    - "정원"
    - "인공지반녹화"
    - "옥상녹화"
    - "벽면녹화"
    - "도시재생"
    - "조경관리"
    - "조경공사"
    # 치유산업 / 복지
    - "치유"
    - "노인복지"
    - "장기요양"
    - "바우처"
    - "산림복지"
    # 사회적경제 / 공공조달
    - "사회적경제"
    - "우선구매"
    - "벤처나라"
    - "나라장터"
    - "공공조달"
    # 제조 / 굿즈
    - "제조혁신"
    - "소공인"
    - "디자인"
    # AI / 디지털
    - "디지털전환"
    - "AI융합"
    - "콘텐츠"

    # --- 이끼/모스 (Moss) ---
    - "이끼재배"
    - "모스월"
    - "이끼테라리움"
    - "이끼조경"
    # --- 조경/정원 (Landscaping/Garden) ---
    - "정원박람회"
    - "국가정원"
    - "조경수"
    - "생태복원"
    - "가로수"
    # --- 치유농업 (Healing Agriculture) ---
    - "치유농업사"
    - "치유농장"
    - "농업치유"
    - "케어팜"
    - "그린케어"
    - "원예복지"
    # --- 사회적기업/경제 (Social Enterprise) ---
    - "사회적경제기업"
    - "자활기업"
    - "마을기업"
    - "사회적협동조합"
    - "소셜임팩트"
    - "사회연대경제"
    # --- AI/디지털 (AI/Digital) ---
    - "농업AI"
    - "스마트팜AI"
    - "정밀농업"
    - "작물진단"
    - "IoT센서"
    - "빅데이터농업"
    # --- 소공인/공방 (Artisan/Workshop) ---
    - "소공인지원"
    - "제조지원"
    - "공방지원"
    - "상품개발"
    - "패키지디자인"
    - "로컬크리에이터"
    # --- 산림형 사회적경제 (Forest Social Economy) ---
    - "산림형 사회적경제"
    - "산림형 예비사회적기업"
    - "산림사업법인"
    - "산촌"
    - "임업"
    - "목재"
    - "사회적기업 인증"
    - "협동조합"
  exclude:
    - "축산"
    - "수산"
    - "벌목"
    - "광업"
    # 관련성 낮은 분야
    - "양식"
    - "원양"
    - "건설장비"
    - "중장비"

notifier:
  telegram:
    # W0(2026-09-12): 첫 재가동 실행은 알림 비활성. 수신자/토큰 미설정(alert/.env 없음)
    enabled: false
    parse_mode: "HTML"
    max_message_length: 4096
  email:
    # W0(2026-09-12): 첫 재가동 실행은 알림 비활성. SMTP 자격증명 미설정
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    digest_hour: 18  # 매일 18시 다이제스트

schedule:
  cron_hours: [9, 15]
  timezone: "Asia/Seoul"

knowledge:
  enabled: true

  classifier:
    enabled: true
    method: "keyword"
    claude_classify_threshold: 0.6

  vector:
    enabled: true
    embedding_provider: "openai"
    embedding_model: "text-embedding-3-small"
    dimensions: 256
    similarity_threshold: 0.75
    top_k: 5

  obsidian:
    enabled: true
    vault_path: ""
    announcement_folder: "11.(주)어반정글/영업/공고"
    research_folder: "Research/공고분석"
    min_relevance_for_sync: 0.5
    author: "이상민"

  history:
    enabled: true
    auto_create_on_relevant: true
    default_priority: 2

  research:
    enabled: true
    schedule: "quarterly"
    claude_model: "claude-sonnet-4-5-20250929"
    max_tokens: 4096

  n8n:
    # N8N Outbound Webhook Integration
    # Sends events to n8n when announcements are detected or statuses change
    # Set N8N_WEBHOOK_URL in .env to activate
    #
    # Payload format:
    #   {
    #     "event": "new_relevant_announcement" | "application_status_changed",
    #     "timestamp": "2025-03-25T...",
    #     "announcement": {
    #       "id": <db_id>,
    #       "title": "공고 제목",
    #       "source": "bizinfo|mafra|...",
    #       "business_domain": "스마트팜|조경|...",
    #       "relevance_score": 0.85,
    #       "url": "https://...",
    #       "period_end": "2025-04-30"
    #     },
    #     "obsidian_path": "/path/to/note" (if created)
    #   }
    #
    # Supported event categories: new_relevant, status_change
    enabled: false
    webhook_url: ""
    notify_on: ["new_relevant", "status_change"]
