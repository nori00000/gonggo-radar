app:
  name: "농업공고알림봇"
  version: "1.0.0"
  log_level: "INFO"
  data_dir: "data"

crawler:
  timeout: 30
  retry_count: 3
  retry_delay: 5
  user_agent: "AgriAlert/1.0"
  sources:
    bizinfo:
      enabled: true
      base_url: "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do"
    mafra:
      enabled: true
      base_url: "https://www.mafra.go.kr/bbs/home/791/rssList.do?row=50"
    smartfarm:
      enabled: true
      base_url: "https://www.smartfarmkorea.net"
    goyang:
      enabled: true
      base_url: "https://www.goyang.go.kr/agr"
    nongsaro:
      enabled: true
      base_url: "https://www.nongsaro.go.kr"
    g2b:
      enabled: true
      base_url: "http://apis.data.go.kr/1230000/BidPublicInfoService"
      filter_keywords:
        - "조경"
        - "녹화"
        - "정원"
        - "이끼"
        - "수목"
        - "식재"
        - "녹지"
        - "도시숲"
        - "학교숲"
        - "탄소숲"
        - "치유정원"
        - "스마트팜"
        - "시설원예"
        - "농업"
        - "산림"
        - "치유"
        - "사회적기업"
    kstartup:
      enabled: true
      base_url: "https://apis.data.go.kr/B552735/kisedKstartupService01"
    smes:
      enabled: true
      base_url: "https://www.smes.go.kr"
    subsidy24:
      enabled: true
      base_url: "https://apis.data.go.kr/B554287/SubsidyBusinessInfoService/getSubsidyBusinessInfo"
    forest_service:
      enabled: true
      base_url: "https://www.forest.go.kr"
    gyeonggi:
      enabled: true
      base_url: "https://www.gg.go.kr"
    gafi:
      enabled: true
      base_url: "https://www.gafi.or.kr"
    gbsa:
      enabled: true
      base_url: "https://www.gbsa.or.kr"
    socialenterprise:
      enabled: true
      base_url: "https://www.socialenterprise.or.kr"
      fetch_detail: false
    ekr:
      enabled: true
      base_url: "https://www.ekr.or.kr"
    epis:
      enabled: true
      base_url: "https://www.epis.or.kr"
    nongup_gg:
      enabled: true
      base_url: "https://nongup.gg.go.kr"
    rda:
      enabled: true
      base_url: "https://www.rda.go.kr"
    semas:
      enabled: true
      base_url: "https://www.semas.or.kr"
    kosmes:
      enabled: true
      base_url: "https://www.kosmes.or.kr"
    ipet:
      enabled: true
      base_url: "https://www.ipet.re.kr"
    apfs:
      enabled: true
      base_url: "https://www.apfs.kr"
    agrohealing:
      enabled: true
      base_url: "https://agrohealing.go.kr"
    fowi:
      enabled: true
      base_url: "https://fowi.or.kr"
      bypass_threshold: true
    seis:
      enabled: true
      base_url: "https://www.seis.or.kr"
      fetch_detail: false
    ggeea:
      enabled: true
      base_url: "https://www.ggeea.or.kr"
    mois_sse:
      enabled: true
      base_url: "https://www.mois.go.kr"
    goyang_startup:
      enabled: true
      base_url: "https://www.goyangstartup.kr"
    kofpi:
      enabled: true
      base_url: "https://www.kofpi.or.kr"
      bypass_threshold: true
      fetch_detail: false
    forest_press:
      enabled: true
      base_url: "https://www.forest.go.kr"
      bypass_threshold: true
    lawmaking:
      enabled: true
      base_url: "https://opinion.lawmaking.go.kr"
      bypass_threshold: true
      fetch_detail: false
    coop:
      enabled: true
      base_url: "https://www.coop.go.kr"
      bypass_threshold: true
      fetch_detail: false

    # ── 2차 미디어 RSS (P1-R 계약) ────────────────────────────────────
    # kind: media = **월간호 전용**. 다만 이 줄은 **확인용**이다 - 종류의
    # 정본은 크롤러 클래스의 KIND 이고(alert/crawlers/media_rss.py), 이 줄을
    # 지워도 media 는 media 로 돈다. 허용값은 gonggo|media 뿐이며 그 밖의
    # 값은 설정 로딩이 소스를 통째로 버린다(라운드 2 HIGH).
    # 회사 선택 경로(select_for_storage)에 들어가지 않으므로
    # bypass_threshold 는 의미가 없고, 그래서 false 로 못박아 둔다 - true 로
    # 바뀌어도 회사 알림이 열리지 않지만 읽는 사람이 헷갈린다.
    # base_url 이 곧 검증된 피드 URL 이다
    # (results/R-monthly-sources.md §1 의 URL 그대로, 추측 금지).
    lifein:
      enabled: true
      base_url: "https://www.lifein.news/rss/allArticle.xml"
      kind: "media"
      bypass_threshold: false
      fetch_detail: false
    eroun:
      enabled: true
      base_url: "https://www.eroun.net/rss/S1N1.xml"
      kind: "media"
      bypass_threshold: false
      fetch_detail: false
    senews:
      enabled: true
      base_url: "https://www.senews.kr/rss/rss_news.php"
      kind: "media"
      bypass_threshold: false
      fetch_detail: false
    kfnews:
      enabled: true
      base_url: "https://www.kfnews.co.kr/rss/allArticle.xml"
      kind: "media"
      bypass_threshold: false
      fetch_detail: false

analyzer:
  keyword_threshold: 0.3
  claude_threshold: 0.3
  claude_model: "claude-sonnet-4-5-20250929"
  max_claude_calls_per_run: 50
  # LLM 백엔드 설정: "auto" | "claude" | "ollama" | "none"
  # auto: ANTHROPIC_API_KEY 있으면 claude, 없으면 ollama
  # none: LLM 2차 분석을 건너뛰고 키워드 점수만 사용 (analyzer.py의 backend 가드)
  #       m1-pro 운영 기준값: Anthropic API 사용 금지 + ollama 미설치
  llm_backend: "none"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:72b"

keywords:
  must_match:
    # 이끼 재배 / 스마트팜
    - "이끼"
    - "스마트팜"
    - "시설원예"
    - "시설농업"
    - "스마트농업"
    # 조경 / 정원
    - "조경"
    - "도시녹화"
    - "학교숲"
    - "탄소숲"
    # 치유산업
    - "치유농업"
    - "산림치유"
    # 사회적기업
    - "사회적기업"
    - "소셜벤처"
  boost:
    # 농업 일반
    - "농업"
    - "영농"
    - "귀농"
    - "청년농"
    - "신규농업인"
    - "농업기술"
    - "농업지원"
    - "보조금"
    - "지원사업"
    - "공모"
    # 지역
    - "경기도"
    - "고양시"
    # 농업 세부
    - "6차산업"
    - "농촌"
    - "ICT"
    - "스마트온실"
    - "환경제어"
    - "식물공장"
    - "특용작물"
    - "관상식물"
    # 조경 / 정원
    - "정원"
    - "인공지반녹화"
    - "옥상녹화"
    - "벽면녹화"
    - "도시재생"
    - "조경관리"
    - "조경공사"
    # 치유산업 / 복지
    - "치유"
    - "노인복지"
    - "장기요양"
    - "바우처"
    - "산림복지"
    # 사회적경제 / 공공조달
    - "사회적경제"
    - "우선구매"
    - "벤처나라"
    - "나라장터"
    - "공공조달"
    # 제조 / 굿즈
    - "제조혁신"
    - "소공인"
    - "디자인"
    # AI / 디지털
    - "디지털전환"
    - "AI융합"
    - "콘텐츠"

    # --- 이끼/모스 (Moss) ---
    - "이끼재배"
    - "모스월"
    - "이끼테라리움"
    - "이끼조경"
    # --- 조경/정원 (Landscaping/Garden) ---
    - "정원박람회"
    - "국가정원"
    - "조경수"
    - "생태복원"
    - "가로수"
    # --- 치유농업 (Healing Agriculture) ---
    - "치유농업사"
    - "치유농장"
    - "농업치유"
    - "케어팜"
    - "그린케어"
    - "원예복지"
    # --- 사회적기업/경제 (Social Enterprise) ---
    - "사회적경제기업"
    - "자활기업"
    - "마을기업"
    - "사회적협동조합"
    - "소셜임팩트"
    - "사회연대경제"
    # --- AI/디지털 (AI/Digital) ---
    - "농업AI"
    - "스마트팜AI"
    - "정밀농업"
    - "작물진단"
    - "IoT센서"
    - "빅데이터농업"
    # --- 소공인/공방 (Artisan/Workshop) ---
    - "소공인지원"
    - "제조지원"
    - "공방지원"
    - "상품개발"
    - "패키지디자인"
    - "로컬크리에이터"
    # --- 산림형 사회적경제 (Forest Social Economy) ---
    - "산림형 사회적경제"
    - "산림형 예비사회적기업"
    - "산림사업법인"
    - "산촌"
    - "임업"
    - "목재"
    - "사회적기업 인증"
    - "협동조합"
  exclude:
    - "축산"
    - "수산"
    - "벌목"
    - "광업"
    # 관련성 낮은 분야
    - "양식"
    - "원양"
    - "건설장비"
    - "중장비"

notifier:
  telegram:
    # W0(2026-09-12): 첫 재가동 실행은 알림 비활성. 수신자/토큰 미설정(alert/.env 없음)
    enabled: false
    parse_mode: "HTML"
    max_message_length: 4096
  email:
    # W0(2026-09-12): 첫 재가동 실행은 알림 비활성. SMTP 자격증명 미설정
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    digest_hour: 18  # 매일 18시 다이제스트

schedule:
  cron_hours: [9, 15]
  timezone: "Asia/Seoul"

knowledge:
  enabled: true

  classifier:
    enabled: true
    method: "keyword"
    claude_classify_threshold: 0.6

  vector:
    enabled: true
    embedding_provider: "openai"
    embedding_model: "text-embedding-3-small"
    dimensions: 256
    similarity_threshold: 0.75
    top_k: 5

  obsidian:
    enabled: true
    vault_path: ""
    announcement_folder: "11.(주)어반정글/영업/공고"
    research_folder: "Research/공고분석"
    min_relevance_for_sync: 0.5
    author: "이상민"

  history:
    enabled: true
    auto_create_on_relevant: true
    default_priority: 2

  research:
    enabled: true
    schedule: "quarterly"
    claude_model: "claude-sonnet-4-5-20250929"
    max_tokens: 4096

  n8n:
    # N8N Outbound Webhook Integration
    # Sends events to n8n when announcements are detected or statuses change
    # Set N8N_WEBHOOK_URL in .env to activate
    #
    # Payload format:
    #   {
    #     "event": "new_relevant_announcement" | "application_status_changed",
    #     "timestamp": "2025-03-25T...",
    #     "announcement": {
    #       "id": <db_id>,
    #       "title": "공고 제목",
    #       "source": "bizinfo|mafra|...",
    #       "business_domain": "스마트팜|조경|...",
    #       "relevance_score": 0.85,
    #       "url": "https://...",
    #       "period_end": "2025-04-30"
    #     },
    #     "obsidian_path": "/path/to/note" (if created)
    #   }
    #
    # Supported event categories: new_relevant, status_change
    enabled: false
    webhook_url: ""
    notify_on: ["new_relevant", "status_change"]

# ---------------------------------------------------------------------------
# 협의회 적재 프로파일 (P0 관찰 모드, 계약 §A)
# ---------------------------------------------------------------------------
# 회사 프로파일(위 keywords: 블록)과 **완전히 독립**이다. 여기를 넓혀도 회사
# 알림 경로의 relevance_score·is_notified 는 바뀌지 않는다(불변 조건 1).
# 어휘 정본: lanes/p0/council-vocab.md (W37 실측 제목·소스만 사용한 v0.1).
# sources 를 비우면 프로파일 전체가 비활성이 된다(킬 스위치).
council_profile:
  sources:
    - "mafra"
    - "forest_service"
    - "mois_sse"
    - "socialenterprise"
    - "seis"
    - "coop"
    - "fowi"
    - "kofpi"
    - "forest_press"
    - "lawmaking"
    - "bizinfo"
    - "g2b"
    - "kstartup"
    - "subsidy24"
    # 2차 미디어 (P1-R). 협의회 어휘에 걸리는 기사만 남고 나머지는 탈락
    # 원장으로 간다 - senews 의 지역행정 기사가 여기서 걸러진다.
    - "lifein"
    - "eroun"
    - "senews"
    - "kfnews"

  # council-vocab.md §1 — 가/나/다/라 4군 전량
  must_match:
    # 가. 사회적경제 제도어
    - "사회적기업"
    - "예비사회적기업"
    - "사회적협동조합"
    - "협동조합"
    - "마을기업"
    - "사회적경제"
    - "사회연대경제"
    - "성장지원센터"
    - "멤버십기업"
    - "입주기업"
    - "사회보험료"
    - "공공조달"
    # 나. 산림·임업어
    - "산림"
    - "임업"
    - "산지"
    # P1' 계약 §0: 레인 A 갭 — composer.FOREST_INDUSTRY_KEYWORDS 에는 있고
    # 협의회 적재 프로파일에는 없어 임도 공고가 적재 전에 떨어졌다.
    - "임도"
    - "배출권거래제"
    - "해외산림"
    - "오픈이노베이션"
    - "미래인재"
    - "전문교육기관"
    - "입법예고"
    - "산림과학기술"
    # 다. 산림복지·숲체험어
    - "산림복지"
    - "숲체험"
    - "숲체원"
    - "나눔의숲"
    - "숲동행"
    - "숲여행"
    - "산림문화"
    - "취업아카데미"
    # 라. 목재·임산물어
    - "목재"
    - "임산물"
    - "산양삼"
    - "산촌자원"
    - "먹거리숲"
    - "산림소득"
    - "유통센터"
    - "가공산업"

  # council-vocab.md §2 — 태그 ← 실측 표기 변형. "–" 행은 표기 변형이 관측되지
  # 않은 것이라 표준형 하나만 둔다(유입 시 보강).
  eligibility:
    사회적기업: ["사회적기업", "(예비)사회적기업"]
    사회적협동조합: ["사회적협동조합", "(사회적)협동조합"]
    협동조합: ["협동조합", "(사회적)협동조합", "일반협동조합"]
    마을기업: ["마을기업"]
    예비사회적기업: ["예비사회적기업", "(예비)사회적기업", "산림형 예비사회적기업"]
    비영리: ["비영리"]
    소셜벤처: ["소셜벤처"]
    중소기업: ["중소기업"]
    개인사업자: ["개인사업자"]
    농업법인: ["농업법인"]
    산림사업법인: ["산림사업법인"]
    임업인: ["임업인"]

  # council-vocab.md §3 — 복합 명칭은 태그 동시 부여(메모 그대로):
  # [경기강원센터]→경기+강원, 충청권역·세종대전충청→충북+충남,
  # [부산울산경남센터]→경남.
  region:
    전국: ["전국"]
    강원: ["강원", "경기강원센터"]
    경기: ["경기", "경기도", "경기강원센터"]
    충북: ["충북", "충북센터", "충청권역", "세종대전충청"]
    충남: ["충남", "충청권역", "세종대전충청센터"]
    경북: ["경북"]
    경남: ["경남", "부산울산경남센터"]
    전북: ["전북"]
    전남: ["전남"]
    서울: ["서울", "강동구"]

  # council-vocab.md §4 — **"안전" 판정 어휘만** 넣는다. "위험" 판정
  # (채용·산림정화·캠페인·국제산림협력)은 모집 공고와 충돌하므로 자동 제외에
  # 넣지 않는다("삭제 금지, 수동 검토 큐" 운영 메모).
  # 주의: 매칭은 부분 문자열이라 "인사"는 "법인사업자"·"확인사항" 같은 표기에도
  # 걸린다. P0 은 관찰 모드(발송 없음)이므로 사전 그대로 두고, observe 표본으로
  # 오탈락을 세어 본 뒤 정규식·경계 조건으로 좁힌다.
  exclude:
    - "수상작 발표"
    - "공모결과"
    - "인사"
    - "입찰결과"
    - "사법경찰"
    - "외교"
    - "호우"

  # ── P1' 라운드 5 — 2차 미디어의 **월간호 2차 관문** ──────────────────────
  # 근거: `results/G-sample-review.md` (라이브 표본 40건 재판정). 적재 프로파일은
  # "산림 관련성"만 보므로 임업 전문지 헤드라인이 거의 전부 통과한다 —
  # 표본에서 kfnews 23건이 전량 통과했고 점수도 0.5~0.6에 고착돼 있었다.
  # 그중 다수는 사설·기관 행보·태세 보도라 회원이 움직일 일이 없다.
  #
  # 이 두 목록은 **월간호의 media 행에만** 쓰인다. 적재(council.score_item)·
  # 주간호·회사 알림 어느 경로도 이 어휘를 보지 않는다.
  # 비워 두면 어떤 미디어도 월간호에 실리지 않는다(fail-closed 킬 스위치).

  # (1) 제목에 이 중 하나는 있어야 한다 — 회원이 움직일 수 있다는 표지
  media_action_cues:
    - "신청"
    - "모집"
    - "공고"
    - "접수"
    - "제도"
    - "시행"
    - "개정"
    - "지원사업"
    - "지원금"
    - "마감"
    - "인증"
    - "지정"
    - "설명회"
    - "입법예고"
    - "기본법"
    - "예산"

  # (2) 제목에 이 중 하나라도 있으면 싣지 않는다 — 의견·의전·태세 보도
  media_exclude:
    - "[사설]"
    - "[기고]"
    - "[칼럼]"
    - "행보"
    - "태세"
    - "점검"
    - "간담회"
    - "시상"
    - "수상"
    - "임명"
    - "취임"
    - "졸업"
    - "기념식"
    - "방문"
