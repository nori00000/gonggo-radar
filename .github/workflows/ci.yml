name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x --ignore=tests/test_db_pg.py --ignore=tests/test_integration_api.py
        env:
          TELEGRAM_BOT_TOKEN: "test"
          TELEGRAM_CHAT_ID: "test"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check alert/ tests/ --select E,F,W --ignore E501
